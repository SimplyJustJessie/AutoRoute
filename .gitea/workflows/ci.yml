name: CI

# Linux-only by design: AutoRoute targets PipeWire/WirePlumber, which exist nowhere else.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in CI needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build · Test · Smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # --locked-mode instead of a plain restore: fails (NU1004) if packages.lock.json and the
      # projects disagree, so a dependency bump that forgets to refresh the lock can't land. The
      # lock is what lets the AUR package fetch an audited, hash-pinned set (Directory.Build.props).
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test --no-build -c Release

      - name: Dependency vulnerability audit
        run: |
          dotnet list package --include-transitive --vulnerable | tee /tmp/audit.txt
          ! grep -q "has the following vulnerable packages" /tmp/audit.txt

      # Window-free checks against the captured fixture graph — no display, no PipeWire needed.
      - name: Smoke — viewmodel flows (--smoke)
        run: dotnet run --project src/AutoRoute.App -c Release --no-build -- --smoke

      - name: Smoke — headless UI render (--smoke-ui)
        run: dotnet run --project src/AutoRoute.App -c Release --no-build -- --smoke-ui

      - name: Stress — perf budget + leak check (--stress)
        run: dotnet run --project src/AutoRoute.App -c Release --no-build -- --stress

      # Render the board with headless Skia and attach the PNGs, so every PR carries
      # an up-to-date visual of the UI it ships.
      - name: Render board screenshots
        run: dotnet run --project src/AutoRoute.App -c Release --no-build -- --screenshot ci-screenshots

      # upload-artifact@v4 refuses to run against non-github.com servers, so pin v3 —
      # its older artifact API is the one Gitea implements.
      - name: Upload screenshots
        uses: actions/upload-artifact@v3
        with:
          name: board-screenshots
          path: ci-screenshots/
          if-no-files-found: error

  appimage:
    name: AppImage (linux-x64)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe supplies the AppImage version

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build AppImage
        run: scripts/build-appimage.sh

      # Prove the bundle actually boots: the runtime + Avalonia + fixture graph, FUSE-less.
      - name: Smoke test the AppImage
        run: |
          set -euo pipefail
          image=(out/AutoRoute-*-x86_64.AppImage)
          "${image[0]}" --appimage-extract-and-run --smoke
          "${image[0]}" --appimage-extract-and-run --smoke-ui

      - name: Upload AppImage
        uses: actions/upload-artifact@v3
        with:
          name: AutoRoute-AppImage
          path: out/AutoRoute-*.AppImage
          if-no-files-found: error
