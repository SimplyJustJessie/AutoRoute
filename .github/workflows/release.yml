name: Release

# Push a v* tag (e.g. v0.1.0) to build the AppImage and attach it to a GitHub Release.
# The manual trigger rebuilds and (re)attaches the asset for an EXISTING tag's release —
# for when a release run failed after the tag was already created.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release asset for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  appimage:
    name: Release AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build AppImage
        run: scripts/build-appimage.sh
        env:
          # Not "VERSION": MSBuild would map that env var onto $(Version) and fail the publish.
          AUTOROUTE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Smoke test the AppImage
        run: |
          set -euo pipefail
          image=(out/AutoRoute-*-x86_64.AppImage)
          "${image[0]}" --appimage-extract-and-run --smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: out/AutoRoute-*.AppImage
          generate_release_notes: true
